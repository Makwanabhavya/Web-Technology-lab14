
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow p-4 w-100" style="max-width: 500px;">

            <h2 class="text-center text-primary mb-4">
                Quiz Application
            </h2>

            <!-- Quiz Section -->
            <div id="quizBox">

                <p id="questionNumber" class="text-muted"></p>

                <!-- Progress Bar -->
                <div class="progress mb-4">
                    <div id="progressBar"
                         class="progress-bar bg-primary"
                         style="width: 0%">
                    </div>
                </div>

                <h5 id="question" class="mb-4"></h5>

                <!-- Answer Options -->
                <div id="options" class="d-grid gap-2"></div>

                <!-- Next Button -->
                <button id="nextBtn"
                        class="btn btn-primary w-100 mt-4"
                        onclick="nextQuestion()"
                        disabled>
                    Next Question
                </button>

            </div>

            <!-- Final Result Section -->
            <div id="resultBox" class="text-center d-none">

                <h3 class="text-success">Quiz Completed!</h3>

                <h4 id="finalScore" class="my-4"></h4>

                <p id="message"></p>

                <button class="btn btn-primary"
                        onclick="restartQuiz()">
                    Restart Quiz
                </button>

            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script>

        // Quiz Questions
        const questions = [
            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "High Text Machine Language",
                    "Hyper Tool Markup Language",
                    "Home Text Markup Language"
                ],
                answer: 0
            },
            {
                question: "Which CSS framework is used here?",
                options: [
                    "React",
                    "Angular",
                    "Bootstrap",
                    "Django"
                ],
                answer: 2
            },
            {
                question: "Which language makes a webpage interactive?",
                options: [
                    "HTML",
                    "JavaScript",
                    "CSS",
                    "SQL"
                ],
                answer: 1
            },
            {
                question: "Which HTML tag is used for a paragraph?",
                options: [
                    "<h1>",
                    "<div>",
                    "<span>",
                    "<p>"
                ],
                answer: 3
            },
            {
                question: "Which Bootstrap class creates a button?",
                options: [
                    "button",
                    "btn",
                    "button-primary",
                    "bootstrap-btn"
                ],
                answer: 1
            }
        ];

        // Variables
        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;

        // Display Question
        function loadQuestion() {

            selectedAnswer = null;

            document.getElementById("nextBtn").disabled = true;

            const q = questions[currentQuestion];

            document.getElementById("questionNumber").innerText =
                `Question ${currentQuestion + 1} of ${questions.length}`;

            document.getElementById("question").innerText =
                q.question;

            // Update progress bar
            let progress =
                ((currentQuestion + 1) / questions.length) * 100;

            document.getElementById("progressBar").style.width =
                progress + "%";

            // Display options
            let optionsHTML = "";

            q.options.forEach((option, index) => {

                optionsHTML += `
                    <button class="btn btn-outline-primary text-start option-btn"
                            onclick="selectAnswer(${index})">
                        ${String.fromCharCode(65 + index)}. ${option.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                    </button>
                `;

            });

            document.getElementById("options").innerHTML =
                optionsHTML;

            document.getElementById("nextBtn").innerText =
                currentQuestion === questions.length - 1
                ? "Show Result"
                : "Next Question";
        }

        // Check Selected Answer
        function selectAnswer(index) {

            if (selectedAnswer !== null) return;

            selectedAnswer = index;

            const correctAnswer =
                questions[currentQuestion].answer;

            const buttons =
                document.querySelectorAll(".option-btn");

            // Update score
            if (index === correctAnswer) {
                score++;
            }

            // Highlight answers
            buttons.forEach((button, i) => {

                button.disabled = true;

                button.classList.remove("btn-outline-primary");

                if (i === correctAnswer) {
                    button.classList.add("btn-success");
                }
                else if (i === index) {
                    button.classList.add("btn-danger");
                }
                else {
                    button.classList.add("btn-outline-secondary");
                }

            });

            document.getElementById("nextBtn").disabled = false;
        }

        // Next Question
        function nextQuestion() {

            if (selectedAnswer === null) return;

            currentQuestion++;

            if (currentQuestion < questions.length) {
                loadQuestion();
            }
            else {
                showResult();
            }
        }

        // Show Final Result
        function showResult() {

            document.getElementById("quizBox")
                .classList.add("d-none");

            document.getElementById("resultBox")
                .classList.remove("d-none");

            document.getElementById("finalScore").innerText =
                `Your Score: ${score} / ${questions.length}`;

            let percentage = (score / questions.length) * 100;

            let message = "";

            if (percentage >= 80) {
                message = "Excellent Performance!";
            }
            else if (percentage >= 50) {
                message = "Good Job! Keep Practicing.";
            }
            else {
                message = "Keep Learning! Try Again.";
            }

            document.getElementById("message").innerText =
                message;
        }

        // Restart Quiz
        function restartQuiz() {

            currentQuestion = 0;
            score = 0;
            selectedAnswer = null;

            document.getElementById("quizBox")
                .classList.remove("d-none");

            document.getElementById("resultBox")
                .classList.add("d-none");

            loadQuestion();
        }

        // Start Quiz
        loadQuestion();

    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
